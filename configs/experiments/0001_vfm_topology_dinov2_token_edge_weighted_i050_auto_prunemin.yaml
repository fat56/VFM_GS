name: 0001_vfm_topology_dinov2_token_edge_weighted_i050_auto_prunemin
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_token_edge_l1
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_loss_thresh: 0.45
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_weight: 0.25
  vfm_importance_weight: 0.50
  vfm_importance_mode: weighted
  vfm_use_albedo_sh0: true
  target_gaussian_staged: true
  target_gaussian_stage_margin: 1.10
  target_gaussian_stage_interval: 500
  prune_min_gaussian_target_ratio: 0.7042253521126761
experiment:
  status: dinov2_token_edge_weighted_auto_capacity_floor_probe
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: DINO weighted i0.50 + 自动容量下限；当 target 取 baseline*1.42 时，下限约为 baseline 容量。
