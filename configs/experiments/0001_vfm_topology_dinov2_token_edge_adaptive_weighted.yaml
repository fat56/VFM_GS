name: 0001_vfm_topology_dinov2_token_edge_adaptive_weighted
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_token_edge_l1
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_loss_thresh: 0.45
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_weight: 0.25
  vfm_importance_weight: 0.50
  vfm_importance_mode: adaptive_weighted
  vfm_importance_budget_count: 430000
  vfm_importance_budget_start_ratio: 0.90
  vfm_importance_budget_curve: quadratic
  vfm_use_albedo_sh0: true
experiment:
  status: dinov2_token_edge_adaptive_weighted_probe
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: Smoothly transitions from max-style partial VFM importance to weighted RGB/VFM importance near a soft Gaussian budget.
