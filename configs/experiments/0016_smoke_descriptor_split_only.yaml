name: 0016_smoke_descriptor_split_only
extends: fastgs_big
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_descriptor_cosine
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_dinov2_repo: output/0001/external/dinov2
  vfm_dinov2_device: cuda
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_descriptor_token_smooth_kernel: 3
  vfm_weight: 0.0
  vfm_importance_weight: 1.0
  vfm_importance_mode: vfm_only
  vfm_use_albedo_sh0: true
  densify_clone_enabled: false
  densify_split_enabled: true
  densify_prune_enabled: false
  final_prune_enabled: false
  opacity_reset_interval: 999999
experiment:
  status: 0016_descriptor_split_only_smoke
  proposal: docs/experiments/0016_tokenedge_split_only_after_baseline/proposal.md
  note: DINOv2 descriptor controls only split candidates during short 2k continuation smoke runs.
