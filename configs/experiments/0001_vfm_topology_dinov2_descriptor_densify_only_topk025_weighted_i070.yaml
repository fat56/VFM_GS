name: 0001_vfm_topology_dinov2_descriptor_densify_only_topk025_weighted_i070
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_descriptor_cosine
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_dinov2_repo: output/0001/external/dinov2
  vfm_dinov2_device: cuda
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_descriptor_token_smooth_kernel: 3
  vfm_weight: 0.0
  vfm_importance_weight: 0.70
  vfm_importance_mode: weighted
  vfm_use_albedo_sh0: true
experiment:
  status: semantic_descriptor_topk025_weighted_i070_probe
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: DINO descriptor cosine residual 只介入 densification；在 top-k25 质量档和 i0.50 容量受控档之间寻找更强质量-容量折中。
