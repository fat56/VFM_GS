name: 0003_dino_descriptor_rgb_broad
extends: fastgs_big
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  loss_thresh: 0.05
  vfm_enable: true
  vfm_backend: dinov2_descriptor_cosine
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_dinov2_repo: output/0001/external/dinov2
  vfm_dinov2_device: cuda
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_descriptor_token_smooth_kernel: 3
  vfm_weight: 0.0
  vfm_importance_mode: rgb_broad
  vfm_rgb_broad_topk: 0.50
  vfm_use_albedo_sh0: true
experiment:
  status: rgb_broad_candidate_control
  proposal: docs/experiments/0003_dino_guidance_reboot/proposal.md
  note: Matched control for Phase 1; RGB/FastGS candidate region is relaxed via loss_thresh 0.05 and broad top-50% per-Gaussian support, while DINO is computed only to keep the scorer path comparable.
