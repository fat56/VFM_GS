name: 0001_vfm_topology_dinov2_descriptor
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_descriptor_cosine
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_dinov2_repo: output/0001/external/dinov2
  vfm_dinov2_device: cuda
  vfm_loss_thresh: 0.5
  vfm_weight: 0.25
  vfm_importance_weight: 1.0
  vfm_importance_mode: max
  vfm_use_albedo_sh0: true
experiment:
  status: dinov2_descriptor_v0
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: Runs DINOv2 on SH0 rendered images at scoring time and compares patch descriptors against cached GT DINOv2 tokens with cosine distance.
