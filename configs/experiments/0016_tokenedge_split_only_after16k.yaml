name: 0016_tokenedge_split_only_after16k
extends: fastgs_big
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_token_edge_l1
  vfm_cache_dir: output/0001/vfm_cache_large/bicycle_dinov2_vitl14_token_edge_w1600
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_weight: 0.0
  vfm_importance_weight: 1.0
  vfm_importance_mode: vfm_only
  vfm_use_albedo_sh0: true
  densify_clone_enabled: false
  densify_split_enabled: true
  densify_prune_enabled: false
  final_prune_enabled: false
  opacity_reset_interval: 999999
experiment:
  status: 0016_tokenedge_split_only_5k_followup
  proposal: docs/experiments/0016_tokenedge_split_only_after_baseline/proposal.md
  note: DINOv2 token-edge controls only split candidates during a 5k continuation from baseline checkpoint-curve states.
