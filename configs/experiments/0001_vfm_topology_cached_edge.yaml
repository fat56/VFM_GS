name: 0001_vfm_topology_cached_edge
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: cached_edge_l1
  vfm_cache_dir: output/0001/vfm_cache/bicycle_edge
  vfm_loss_thresh: 0.5
  vfm_weight: 0.25
  vfm_importance_weight: 1.0
  vfm_importance_mode: max
  vfm_use_albedo_sh0: true
experiment:
  status: cached_edge_v1
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: Requires running vfm_gs.cli.build_vfm_cache before training.
