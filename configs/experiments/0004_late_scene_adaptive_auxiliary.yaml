name: 0004_late_scene_adaptive_auxiliary
extends: fastgs_big
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: depth_anything_depth_prior
  vfm_cache_dir: output/0002/vfm_cache/bicycle_depth_anything_v2s_depth
  vfm_metric_map_mode: topk
  vfm_metric_topk: 0.25
  vfm_weight: 0.0
  vfm_importance_mode: rgb_only
  vfm_prune_protect_weight: 0.25
  vfm_prune_protect_mode: rgb_prune_auto_topk
  vfm_prune_protect_rgb_auto_min_topk: 0.001
  vfm_prune_protect_rgb_auto_max_topk: 0.010
  vfm_prune_protect_rgb_auto_std_scale: 2.0
  vfm_prune_protect_min_count: 5
  vfm_prune_protect_power: 2.0
  vfm_active_from_iter: 15001
  vfm_use_albedo_sh0: true
experiment:
  status: late_scene_adaptive_auxiliary_probe
  proposal: docs/experiments/0004_late_scene_adaptive_auxiliary/proposal.md
  note: Late-stage auxiliary pilot. RGB/FastGS still owns candidate generation and budget; Depth Anything only reranks/protects inside the RGB envelope after densification matures.
