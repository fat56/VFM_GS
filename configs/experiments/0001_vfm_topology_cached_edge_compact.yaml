name: 0001_vfm_topology_cached_edge_compact
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: cached_edge_l1
  vfm_cache_dir: output/0001/vfm_cache/bicycle_edge_u8
  vfm_loss_thresh: 0.5
  vfm_weight: 0.25
  vfm_use_albedo_sh0: true
experiment:
  status: compact_cache_v1
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: Uses npz_uint8 compressed edge cache; validate with vfm_gs.cli.validate_vfm_cache before training.
