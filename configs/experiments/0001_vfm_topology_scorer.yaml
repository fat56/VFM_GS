name: 0001_vfm_topology_scorer
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: mock_l1
  vfm_loss_thresh: 0.5
  vfm_weight: 0.25
  vfm_importance_weight: 1.0
  vfm_use_albedo_sh0: true
experiment:
  status: mock_v1
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: v1 uses a mock L1 backend to validate the VFM topology scorer plumbing before adding real VFM cache dependencies.
