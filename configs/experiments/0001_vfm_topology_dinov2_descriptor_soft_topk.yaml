name: 0001_vfm_topology_dinov2_descriptor_soft_topk
extends: fastgs_baseline
scorer: vfm_topology_scorer
training_args:
  densification_interval: 100
  vfm_enable: true
  vfm_backend: dinov2_descriptor_cosine
  vfm_cache_dir: output/0001/vfm_cache/bicycle_dinov2_vits14
  vfm_dinov2_repo: output/0001/external/dinov2
  vfm_dinov2_device: cuda
  vfm_loss_thresh: 0.35
  vfm_metric_map_mode: soft_topk
  vfm_metric_topk: 0.15
  vfm_metric_soft_levels: 3
  vfm_descriptor_token_smooth_kernel: 3
  vfm_weight: 0.25
  vfm_importance_weight: 1.0
  vfm_importance_mode: max
  vfm_use_albedo_sh0: true
experiment:
  status: dinov2_descriptor_soft_topk_v0
  proposal: docs/experiments/0001_vfm_topology_scorer/proposal.md
  note: Approximates a soft descriptor metric map with nested top-k binary masks so the existing integer CUDA counter can accumulate weighted multi-level support.
